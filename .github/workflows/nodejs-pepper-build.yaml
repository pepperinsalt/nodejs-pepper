# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: ./dist

jobs:
  # Please do not rename this job
  build-project:
    name: build nodejs-pepper
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # if you add permissions here this needs to be done in the nodejs-pepper-orchestration.yaml as well
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Node assets
        env:
          CI: true
          SITE_URL: ${{ inputs.site-url }}
        run: npm ci

      - name: Setup composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1.0'
          tools: composer:2

      - name: Build PHP assets
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cp .env.example .env
          php artisan key:generate --force -n
